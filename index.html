<!doctype html>
<html lang="en">
  <head>
    <title>Alejandra Bernuy | Vancouver Multidisciplinary Designer</title>
    <meta
      name="description"
      content="Alejandra is a Vancouver-based multidisciplinary designer specializing in branding, UI/UX, and illustration, creating narrative-driven work shaped by curiosity and storytelling."
    />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:image" content="screenshot.jpg" />

    <!-- Reset -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Molle:ital@1&family=Open+Sans:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Shared stylesheet -->
    <link rel="stylesheet" href="./styles/style.css" />

    <!-- Favicons -->
    <link
      rel="icon"
      href="assets/branding-images/newlogo.svg"
      type="image/svg+xml"
    />
    <link
      rel="alternate icon"
      href="assets/branding-images/newlogo.png"
      type="image/png"
      sizes="32x32"
    />
    <link rel="apple-touch-icon" href="assets/branding-images/newlogo.png" />

    <style>
      /* Splash-only styles — kept here, not in shared CSS */

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0a;
        overflow: hidden;
      }

      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        gap: 1.5rem;
        opacity: 0;
        animation: splashIn 0.6s ease 0.1s forwards;
      }

      .splash.fade-out {
        animation: splashOut 0.5s ease forwards;
      }

      @keyframes splashIn {
        to {
          opacity: 1;
        }
      }

      @keyframes splashOut {
        to {
          opacity: 0;
        }
      }

      /* Logo scales in with a gentle spring */
      .splash-logo {
        width: clamp(3.5rem, 12vw, 6rem);
        height: auto;
        display: block;
        transform: scale(0.88);
        animation: logoIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
      }

      @keyframes logoIn {
        to {
          transform: scale(1);
        }
      }

      /* Name fades in after logo settles */
      .splash-name {
        font-family: "IBM Plex Serif", Georgia, serif;
        font-size: clamp(1rem, 3vw, 1.4rem);
        font-weight: 300;
        font-style: italic;
        color: #ae9cff;
        letter-spacing: 0.06em;
        opacity: 0;
        animation: fadeIn 0.5s ease 0.7s forwards;
      }

      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }

      /* Thin progress bar at the bottom */
      .splash-bar-track {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: rgba(174, 156, 255, 0.12);
      }

      .splash-bar-fill {
        height: 100%;
        width: 0%;
        background: #ae9cff;
        animation: barFill 1.8s cubic-bezier(0.4, 0, 0.6, 1) 0.5s forwards;
      }

      @keyframes barFill {
        to {
          width: 100%;
        }
      }

      /* "Enter" skip link — subtle, appears after a beat */
      .splash-skip {
        position: fixed;
        bottom: 1.5rem;
        left: 50%;
        transform: translateX(-50%);
        font-family: "Open Sans", sans-serif;
        font-size: 0.72rem;
        font-weight: 400;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(240, 234, 245, 0.35);
        text-decoration: none;
        opacity: 0;
        animation: fadeIn 0.4s ease 1.2s forwards;
        white-space: nowrap;
        transition: color 0.2s ease;
      }

      .splash-skip:hover {
        color: #ae9cff;
      }
    </style>
  </head>

  <body>
    <div class="splash" id="splash">
      <a href="work.html" aria-label="Enter portfolio">
        <img
          src="assets/branding-images/newlogo.svg"
          alt="Alejandra Bernuy"
          class="splash-logo"
        />
      </a>
      <p class="splash-name">Alejandra Bernuy</p>
    </div>

    <!-- Progress bar -->
    <div class="splash-bar-track" aria-hidden="true">
      <div class="splash-bar-fill"></div>
    </div>

    <!-- Skip for impatient visitors -->
    <a href="work.html" class="splash-skip">Enter</a>

    <script>
      // 2.3s hold, then 0.5s fade out, then redirect
      const HOLD = 2300;
      const FADEOUT = 500;
      const splash = document.getElementById("splash");

      setTimeout(() => {
        splash.classList.add("fade-out");
        setTimeout(() => {
          window.location.href = "work.html";
        }, FADEOUT);
      }, HOLD);
    </script>
  </body>
</html>
