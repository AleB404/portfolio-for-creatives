    <script>
      /* ── Back to top ── */
      const topBtn = document.getElementById("backToTop");
      window.addEventListener("scroll", () => {
        topBtn.classList.toggle("visible", window.scrollY > 600);
      });

      /* ── Lightbox ── */
      (function () {
        const items = Array.from(document.querySelectorAll(".play-item"));
        const overlay = document.getElementById("lbOverlay");
        const lbImg = document.getElementById("lbImg");
        const lbCap = document.getElementById("lbCaption");
        const closeBtn = document.getElementById("lbClose");
        const prevBtn = document.getElementById("lbPrev");
        const nextBtn = document.getElementById("lbNext");
        let current = 0;

        function open(index) {
          current = index;
          const item = items[current];
          lbImg.src = item.dataset.src;
          lbImg.alt = item.dataset.title;
          lbCap.textContent = item.dataset.title;
          overlay.hidden = false;
          document.body.style.overflow = "hidden";
          closeBtn.focus();
        }

        function close() {
          overlay.hidden = true;
          document.body.style.overflow = "";
          items[current].focus();
        }

        function go(dir) {
          open((current + dir + items.length) % items.length);
        }

        /* Open on click */
        items.forEach((item, i) => {
          item.addEventListener("click", () => open(i));
        });

        /* Controls */
        closeBtn.addEventListener("click", close);
        prevBtn.addEventListener("click", () => go(-1));
        nextBtn.addEventListener("click", () => go(1));

        /* Click backdrop to close */
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) close();
        });

        /* Keyboard */
        document.addEventListener("keydown", (e) => {
          if (overlay.hidden) return;
          if (e.key === "Escape") close();
          if (e.key === "ArrowLeft") go(-1);
          if (e.key === "ArrowRight") go(1);
        });

        /* Touch swipe */
        let touchX = 0;
        overlay.addEventListener(
          "touchstart",
          (e) => {
            touchX = e.touches[0].clientX;
          },
          { passive: true },
        );
        overlay.addEventListener(
          "touchend",
          (e) => {
            const delta = touchX - e.changedTouches[0].clientX;
            if (Math.abs(delta) > 40) go(delta > 0 ? 1 : -1);
          },
          { passive: true },
        );
      })();
    </script>
